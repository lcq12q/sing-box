name: Build sing-box v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOS: windows
      GOARCH: amd64
      GOAMD64: v3
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)
          LDFLAGS=$(cat release/LDFLAGS)

          go build \
            -trimpath \
            -buildvcs=false \
            -tags "$TAGS" \
            -ldflags "-s -w $LDFLAGS" \
            -o sing-box.exe \
            ./cmd/sing-box

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-windows-amd64-v3
          path: sing-box.exe
